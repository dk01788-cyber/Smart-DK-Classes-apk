name: Build SDKC Admin v1.1.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip Admin project
        run: |
          rm -rf adminsrc
          mkdir adminsrc
          unzip -o "Smart_DK_Classes_Admin_Source_v1.1.0_Structure_Manager.zip" -d adminsrc
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release APK
        working-directory: adminsrc/Smart_DK_Classes_Admin_Project
        run: gradle assembleRelease
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > release-key.jks
      - name: Sign Admin APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED="adminsrc/Smart_DK_Classes_Admin_Project/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" Smart-DK-Classes-Admin-v1.1.0-aligned.apk
          "$APKSIGNER" sign --ks release-key.jks --ks-key-alias smartdkclasses_release --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out Smart-DK-Classes-Admin-v1.1.0.apk Smart-DK-Classes-Admin-v1.1.0-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs Smart-DK-Classes-Admin-v1.1.0.apk
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: SDKC-Admin-v1.1.0-Signed-APK
          path: Smart-DK-Classes-Admin-v1.1.0.apk
