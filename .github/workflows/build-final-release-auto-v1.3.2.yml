name: Build Smart DK Classes v1.3.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip Android project
        run: |
          rm -rf appsrc
          mkdir -p appsrc
          unzip -o "Smart_DK_Classes_Android_Source_v1.3.2_AdMob_FINAL.zip" -d appsrc

      - name: Enable AndroidX
        working-directory: appsrc
        run: |
          touch gradle.properties

          if grep -q "^android.useAndroidX=" gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if grep -q "^android.enableJetifier=" gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties
          else
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "----- gradle.properties -----"
          cat gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build unsigned release APK
        working-directory: appsrc
        run: |
          gradle clean assembleRelease --stacktrace

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > release-key.jks

      - name: Sign final APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED="appsrc/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$UNSIGNED" ]; then
            echo "Unsigned APK not found:"
            find appsrc/app/build/outputs -type f || true
            exit 1
          fi

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          "$ZIPALIGN" -f -p 4 \
            "$UNSIGNED" \
            Smart-DK-Classes-v1.3.2-aligned.apk

          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias smartdkclasses_release \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out Smart-DK-Classes-v1.3.2.apk \
            Smart-DK-Classes-v1.3.2-aligned.apk

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            Smart-DK-Classes-v1.3.2.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-DK-Classes-v1.3.2-Signed-APK
          path: Smart-DK-Classes-v1.3.2.apk
          if-no-files-found: error
