name: Build Final Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip final project
        run: |
          rm -rf appsrc
          mkdir appsrc
          unzip -o "Smart_DK_Classes_Android_Source_v1.3.0_Admin_Structure_Sync.zip" -d appsrc
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build unsigned release APK
        working-directory: appsrc
        run: gradle assembleRelease

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > release-key.jks

      - name: Sign final APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED="appsrc/app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" Smart-DK-Classes-Final-aligned.apk
          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias smartdkclasses_release \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out Smart-DK-Classes-Final.apk \
            Smart-DK-Classes-Final-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs Smart-DK-Classes-Final.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-DK-Classes-Final-Signed-APK
          path: Smart-DK-Classes-Final.apk
