name: Smart DK Classes - Automatic APK Builder

# Commit a newer Admin/Public source ZIP to the repository root.
# This workflow stays unchanged for later app versions.
on:
  push:
    branches:
      - main
    paths:
      - 'Smart_DK_Classes_Admin_Source*.zip'
      - 'Smart_DK_Classes_Public_Android_Source*.zip'
      - 'Smart_DK_Classes_Android_Source*.zip'
      - '.github/workflows/build-sdkc-auto-apk.yml'
  workflow_dispatch:
    inputs:
      build_target:
        description: App to build manually
        type: choice
        required: true
        default: both
        options:
          - both
          - Admin
          - Public

permissions:
  contents: read

concurrency:
  group: sdkc-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-sources:
    name: Find newest source ZIP files
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed app and latest version automatically
        id: pick
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          MANUAL_TARGET: ${{ inputs.build_target }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess

          root = pathlib.Path('.')
          patterns = {
              'Admin': ['Smart_DK_Classes_Admin_Source*.zip'],
              'Public': [
                  'Smart_DK_Classes_Public_Android_Source*.zip',
                  'Smart_DK_Classes_Android_Source*.zip',
              ],
          }

          def latest_version(path):
              m = re.search(r'(?:^|[_-])v(\d+(?:\.\d+){1,3})(?=[_.-]|$)',
                            path.name, re.IGNORECASE)
              version = tuple(int(x) for x in m.group(1).split('.')) if m else (0,)
              return (version + (0,) * (4 - len(version)), path.name)

          def changed_files():
              if os.environ.get('EVENT_NAME') != 'push':
                  return set()
              before = os.environ.get('BEFORE_SHA') or ''
              after = os.environ.get('COMMIT_SHA') or ''
              if not before or set(before) == {'0'}:
                  return {'.github/workflows/build-sdkc-auto-apk.yml'}
              try:
                  result = subprocess.check_output(
                      ['git', 'diff', '--name-only', before, after], text=True)
                  return set(result.splitlines())
              except subprocess.CalledProcessError:
                  return {'.github/workflows/build-sdkc-auto-apk.yml'}

          files = changed_files()
          manual = os.environ.get('EVENT_NAME') == 'workflow_dispatch'
          target = os.environ.get('MANUAL_TARGET') or 'both'
          workflow_changed = '.github/workflows/build-sdkc-auto-apk.yml' in files
          include = []

          for app, globs in patterns.items():
              if manual:
                  wanted = target == 'both' or target == app
              else:
                  wanted = workflow_changed or any(
                      any(pathlib.PurePosixPath(p).match(g) for g in globs)
                      for p in files)
              if not wanted:
                  continue
              candidates = sorted(
                  {p for pattern in globs for p in root.glob(pattern) if p.is_file()},
                  key=latest_version,
              )
              if not candidates:
                  print(f'No {app} source ZIP found; skipping {app}.')
                  continue
              chosen = candidates[-1]
              print(f'{app}: {chosen.name} (selected latest available ZIP)')
              include.append({'app': app, 'source_zip': str(chosen)})

          matrix = {'include': include}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
              output.write('count=' + str(len(include)) + '\n')
          PY

  build-apk:
    name: Build ${{ matrix.app }} APK
    needs: select-sources
    if: needs.select-sources.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-sources.outputs.matrix) }}

    steps:
      - name: Check out source ZIP
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract ZIP and locate Android project automatically
        id: project
        shell: bash
        env:
          SOURCE_ZIP: ${{ matrix.source_zip }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdkc-source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/sdkc-source"
          PROJECT_DIR=""
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [[ -f "$dir/app/build.gradle" && -f "$dir/app/src/main/AndroidManifest.xml" ]]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find "$RUNNER_TEMP/sdkc-source" -name settings.gradle -type f | sort)
          if [[ -z "$PROJECT_DIR" ]]; then
            echo 'ERROR: ZIP does not contain an Android Gradle project.' >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"
          # Artifact filename labels only. Actual app versionCode/versionName
          # must be maintained inside the ZIP's app/build.gradle.
          ZIP_NAME="$(basename "$SOURCE_ZIP")"
          if [[ "$ZIP_NAME" =~ _v([0-9]+(\.[0-9]+){1,3}) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug and unsigned Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease
          else
            gradle --no-daemon --stacktrace assembleDebug assembleRelease
          fi

      - name: Save Debug APK (install for testing)
        uses: actions/upload-artifact@v4
        with:
          name: SDKC-${{ matrix.app }}-${{ steps.project.outputs.version }}-Debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check optional signing secrets
        id: signing
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KS_BASE64" && -n "$KS_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets missing; Debug APK available.'
          fi

      - name: Sign Release APK if secrets exist
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ADMIN_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
          PUBLIC_ALIAS: ${{ secrets.PUBLIC_KEY_ALIAS }}
          TARGET: ${{ matrix.app }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/sdkc-signing.jks"' EXIT
          printf '%s' "$KS_BASE64" | base64 --decode > "$RUNNER_TEMP/sdkc-signing.jks"
          if [[ "$TARGET" == 'Admin' && -n "$ADMIN_ALIAS" ]]; then
            KS_ALIAS="$ADMIN_ALIAS"
          elif [[ "$TARGET" == 'Public' && -n "$PUBLIC_ALIAS" ]]; then
            KS_ALIAS="$PUBLIC_ALIAS"
          fi
          KS_ALIAS="${KS_ALIAS:-smartdkclasses_release}"
          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          SDK_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/sdkc-aligned.apk"
          "$SDK_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/sdkc-signing.jks" \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/sdkc-release-signed.apk" \
            "$RUNNER_TEMP/sdkc-aligned.apk"
          "$SDK_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/sdkc-release-signed.apk"

      - name: Save signed Release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SDKC-${{ matrix.app }}-${{ steps.project.outputs.version }}-Signed
          path: ${{ runner.temp }}/sdkc-release-signed.apk
          if-no-files-found: error
          retention-days: 30
